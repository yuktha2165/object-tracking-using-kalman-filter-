version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: traffic_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traffic_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=traffic_monitoring
    depends_on:
      - mongodb
    restart: always

volumes:
  mongodb_data:
